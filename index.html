<script>
window.storage = {
  get: async (key) => {
    const v = localStorage.getItem(key);
    if (v === null) return null;
    return { key, value: v };
  },
  set: async (key, value) => {
    localStorage.setItem(key, value);
    return { key, value };
  },
  delete: async (key) => {
    localStorage.removeItem(key);
    return { key, deleted: true };
  },
};

if ('serviceWorker' in navigator) {

const monthNames = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const monthShort = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const dayShort = ["S","M","T","W","T","F","S"];

const fmtDate = (d) => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const fmtMoney = (n, currency = "₹") => `${currency}${n.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
const fmtMoneyShort = (n, currency = "₹") => {
  if (n >= 100000) return `${currency}${(n/100000).toFixed(1)}L`;
  if (n >= 1000) return `${currency}${(n/1000).toFixed(1)}k`;
  return `${currency}${Math.round(n)}`;
};

// Group a list of expenses by category, then by subcategory.
// Returns { [catId]: { total, bySub: { [subId|"none"]: total } } }
function groupBySubcategory(expenseList) {
  const out = {};
  expenseList.forEach(e => {
    if (!out[e.categoryId]) out[e.categoryId] = { total: 0, bySub: {} };
    out[e.categoryId].total += e.amount;
    const sub = e.subcategoryId || "none";
    if (!out[e.categoryId].bySub[sub]) out[e.categoryId].bySub[sub] = 0;
    out[e.categoryId].bySub[sub] += e.amount;
  });
  return out;
}

function subLookup(cat, subId) {
  if (!cat || !subId || subId === "none") return null;
  return (cat.subcategories || []).find(s => s.id === subId);
}

function ExpenseLog() {
  const [view, setView] = useState("today");
  const [selectedDate, setSelectedDate] = useState(new Date());
  const [calendarMonth, setCalendarMonth] = useState(new Date());
  const [expenses, setExpenses] = useState([]); // [{ id, date, categoryId, amount, note }]

  const [profile, setProfile] = useState({ currency: "₹", monthlyBudget: 0 });
  const [loading, setLoading] = useState(true);
  const [saving, setSaving] = useState(false);
  const [editingExpense, setEditingExpense] = useState(null);
  const [showAddForm, setShowAddForm] = useState(false);

  useEffect(() => {
    (async () => {
      try {
        const [e, c, p] = await Promise.all([
          window.storage.get("expenses").catch(() => null),
          window.storage.get("categories").catch(() => null),
          window.storage.get("profile").catch(() => null),
        ]);
        if (e?.value) setExpenses(JSON.parse(e.value));
        if (c?.value) {
          const loaded = JSON.parse(c.value);
          // Migration: ensure every category has subcategories array
          const migrated = loaded.map(cat => ({ ...cat, subcategories: cat.subcategories || [] }));
          setCategories(migrated);
        }
        if (p?.value) setProfile(JSON.parse(p.value));
      } catch {}
      setLoading(false);
    })();
  }, []);

  const saveData = async (key, value) => {
    setSaving(true);
    try { await window.storage.set(key, JSON.stringify(value)); } catch {}
    setTimeout(() => setSaving(false), 400);
  };

  const addExpense = (entry) => {
    const newExp = { ...entry, id: Date.now() };
    const updated = [...expenses, newExp];
    setExpenses(updated);
    saveData("expenses", updated);
  };

  const updateExpense = (id, updates) => {
    const updated = expenses.map(e => e.id === id ? { ...e, ...updates } : e);
    setExpenses(updated);
    saveData("expenses", updated);
  };

  const deleteExpense = (id) => {
    const updated = expenses.filter(e => e.id !== id);
    setExpenses(updated);
    saveData("expenses", updated);
  };

  const updateCategories = (newCats) => {
    setCategories(newCats);
    saveData("categories", newCats);
  };

  const updateProfile = (newProfile) => {
    setProfile(newProfile);
    saveData("profile", newProfile);
  };

  const today = new Date();
  const isToday = fmtDate(today) === fmtDate(selectedDate);
  const currency = profile.currency || "₹";

  return (
    <div style={{minHeight:"100vh",background:"#0a0a0a",fontFamily:"'DM Mono','Courier New',monospace",color:"#e8e8e8",paddingBottom:90}}>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Bebas+Neue&display=swap');
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        button, input, select { font-family: inherit; }
        button { cursor: pointer; }
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: #111; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 2px; }
        @keyframes fadeIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
        .fade-in { animation: fadeIn 0.25s ease forwards; }
        .ex-row:active { transform: scale(0.99); }
        input, select, textarea {
          background: #1a1a1a; border: 1px solid #2a2a2a; color: #e8e8e8;
          padding: 10px 12px; border-radius: 4px; font-size: 13px; width: 100%;
        }
        input:focus, select:focus, textarea:focus { outline: none; border-color: #34D399; }
      `}</style>

      <div style={{padding:"20px 20px 10px",maxWidth:720,margin:"0 auto"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
          <div>
            <div style={{fontSize:9,letterSpacing:5,color:"#555"}}>DAILY · WEEKLY · MONTHLY</div>
            <div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:36,lineHeight:1,color:"#fff",letterSpacing:2,marginTop:2}}>EXPENSE LOG</div>
          </div>
          <button onClick={()=>{setShowAddForm(true);setEditingExpense(null);}}
            style={{background:"#34D399",color:"#000",border:"none",borderRadius:99,padding:"10px 16px",fontSize:11,letterSpacing:2,fontWeight:700}}>
            + ADD
          </button>
        </div>
      </div>

      <div style={{display:"flex",gap:3,padding:"0 16px",maxWidth:720,margin:"0 auto 14px",overflowX:"auto"}}>
        {[
          {id:"today",label:"DAILY"},
          {id:"week",label:"WEEK"},
          {id:"month",label:"MONTH"},
          {id:"year",label:"YEAR"},
          {id:"calendar",label:"CAL"},
          {id:"settings",label:"SET"},
        ].map(t=>(
          <button key={t.id} onClick={()=>setView(t.id)} style={{
            flex:1,padding:"10px 6px",minWidth:50,
            background:view===t.id?"#1a1a1a":"transparent",
            color:view===t.id?"#fff":"#555",
            fontSize:9,letterSpacing:2,
            border:`1px solid ${view===t.id?"#333":"#1a1a1a"}`,
            borderRadius:4,
          }}>{t.label}</button>
        ))}
      </div>

      {view==="today" && <DailyView {...{selectedDate,setSelectedDate,isToday,expenses,categories,currency,onEdit:setEditingExpense,onDelete:deleteExpense}} />}
      {view==="week" && <WeekView {...{selectedDate,setSelectedDate,expenses,categories,currency,today}} />}
      {view==="month" && <MonthView {...{calendarMonth,setCalendarMonth,expenses,categories,currency,profile,today}} />}
      {view==="year" && <YearView {...{calendarMonth,setCalendarMonth,expenses,categories,currency,today}} />}
      {view==="calendar" && <CalendarView {...{calendarMonth,setCalendarMonth,today,setSelectedDate,setView,expenses,categories,currency}} />}
      {view==="settings" && <SettingsView {...{categories,updateCategories,profile,updateProfile,onReset:()=>{
        if (confirm("Delete ALL expenses? Cannot be undone.")) {
          setExpenses([]); saveData("expenses", []);
        }
      },onResetCats:()=>{
        if (confirm("Reset categories to defaults? Your expenses won't be deleted.")) {
          setCategories(defaultCategories); saveData("categories", defaultCategories);
        }
      }}} />}

      {(showAddForm || editingExpense) && (
        <ExpenseForm
          expense={editingExpense}
          categories={categories}
          currency={currency}
          defaultDate={fmtDate(selectedDate)}
          onSave={(entry) => {
            if (editingExpense) updateExpense(editingExpense.id, entry);
            else addExpense(entry);
            setShowAddForm(false);
            setEditingExpense(null);
          }}
          onCancel={() => { setShowAddForm(false); setEditingExpense(null); }}
          onDelete={editingExpense ? () => {
            if (confirm("Delete this expense?")) {
              deleteExpense(editingExpense.id);
              setEditingExpense(null);
            }
          } : null}
        />
      )}

      {saving && <div style={{position:"fixed",bottom:20,left:"50%",transform:"translateX(-50%)",background:"#1a1a1a",border:"1px solid #333",padding:"6px 14px",borderRadius:99,fontSize:10,color:"#888",letterSpacing:2,zIndex:50}}>SAVING...</div>}
    </div>
  );
}

// ====== EXPENSE FORM ======
function ExpenseForm({ expense, categories, currency, defaultDate, onSave, onCancel, onDelete }) {
  const [amount, setAmount] = useState(expense?.amount || "");
  const [categoryId, setCategoryId] = useState(expense?.categoryId || categories[0]?.id);
  const [subcategoryId, setSubcategoryId] = useState(expense?.subcategoryId || "");
  const [date, setDate] = useState(expense?.date || defaultDate);
  const [note, setNote] = useState(expense?.note || "");

  // Reset subcategory when category changes (unless editing and matches)
  const pickCategory = (cid) => {
    if (cid !== categoryId) setSubcategoryId("");
    setCategoryId(cid);
  };

  const selectedCat = categories.find(c => c.id === categoryId);
  const subs = selectedCat?.subcategories || [];

  const save = () => {
    const amt = parseFloat(amount);
    if (!amt || amt <= 0) { alert("Enter a valid amount"); return; }
    if (!categoryId) { alert("Pick a category"); return; }
    onSave({ amount: amt, categoryId, subcategoryId: subcategoryId || null, date, note: note.trim() });
  };

  return (
    <div onClick={onCancel} style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.85)",zIndex:100,display:"flex",alignItems:"flex-end",justifyContent:"center"}}>
      <div onClick={(e)=>e.stopPropagation()} style={{background:"#111",border:"1px solid #333",borderTopLeftRadius:16,borderTopRightRadius:16,padding:20,maxWidth:520,width:"100%",maxHeight:"92vh",overflowY:"auto"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
          <div style={{fontSize:10,color:"#555",letterSpacing:3}}>{expense?"EDIT EXPENSE":"NEW EXPENSE"}</div>
          <button onClick={onCancel} style={{background:"transparent",border:"none",color:"#666",fontSize:22}}>✕</button>
        </div>

        <div style={{marginBottom:14}}>
          <div style={{fontSize:9,color:"#555",letterSpacing:2,marginBottom:6}}>AMOUNT ({currency})</div>
          <input type="number" step="0.01" min="0" value={amount} onChange={(e)=>setAmount(e.target.value)} placeholder="0.00" autoFocus
            style={{fontSize:24,fontFamily:"'Bebas Neue',sans-serif",padding:"14px 12px"}} />
        </div>

        <div style={{marginBottom:14}}>
          <div style={{fontSize:9,color:"#555",letterSpacing:2,marginBottom:6}}>CATEGORY</div>
          <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(95px,1fr))",gap:6}}>
            {categories.map(c => (
              <button key={c.id} onClick={()=>pickCategory(c.id)} style={{
                padding:"10px 6px",
                background: categoryId===c.id ? c.color : "#1a1a1a",
                color: categoryId===c.id ? "#000" : "#888",
                border: `1px solid ${categoryId===c.id ? c.color : "#2a2a2a"}`,
                borderRadius: 6, fontSize: 10, letterSpacing: 1,
                fontWeight: categoryId===c.id ? 700 : 400,
                display:"flex",flexDirection:"column",alignItems:"center",gap:4,
              }}>
                <span style={{fontSize:18}}>{c.icon}</span>
                <span style={{fontSize:9,lineHeight:1.2,textAlign:"center"}}>{c.name}</span>
              </button>
            ))}
          </div>
        </div>

        {subs.length > 0 && (
          <div style={{marginBottom:14}}>
            <div style={{fontSize:9,color:"#555",letterSpacing:2,marginBottom:6}}>SUBCATEGORY (OPTIONAL)</div>
            <div style={{display:"flex",flexWrap:"wrap",gap:5}}>
              <button onClick={()=>setSubcategoryId("")} style={{
                padding:"6px 10px",
                background: subcategoryId==="" ? "#888" : "#1a1a1a",
                color: subcategoryId==="" ? "#000" : "#888",
                border: "none", borderRadius: 99, fontSize: 10, letterSpacing: 1,
                fontWeight: subcategoryId==="" ? 700 : 400,
              }}>None</button>
              {subs.map(sub => (
                <button key={sub.id} onClick={()=>setSubcategoryId(sub.id)} style={{
                  padding:"6px 10px",
                  background: subcategoryId===sub.id ? selectedCat.color : "#1a1a1a",
                  color: subcategoryId===sub.id ? "#000" : "#aaa",
                  border: `1px solid ${subcategoryId===sub.id ? selectedCat.color : "#2a2a2a"}`,
                  borderRadius: 99, fontSize: 10, letterSpacing: 1,
                  fontWeight: subcategoryId===sub.id ? 700 : 400,
                }}>{sub.name}</button>
              ))}
            </div>
          </div>
        )}

        <div style={{marginBottom:14}}>
          <div style={{fontSize:9,color:"#555",letterSpacing:2,marginBottom:6}}>DATE</div>
          <input type="date" value={date} onChange={(e)=>setDate(e.target.value)} />
        </div>

        <div style={{marginBottom:18}}>
          <div style={{fontSize:9,color:"#555",letterSpacing:2,marginBottom:6}}>NOTE (OPTIONAL)</div>
          <input value={note} onChange={(e)=>setNote(e.target.value)} placeholder="e.g. lunch with friends" />
        </div>

        <div style={{display:"flex",gap:6}}>
          <button onClick={onCancel} style={{flex:1,padding:12,background:"transparent",border:"1px solid #333",color:"#888",borderRadius:4,fontSize:11,letterSpacing:2}}>CANCEL</button>
          {onDelete && <button onClick={onDelete} style={{padding:"12px 16px",background:"transparent",border:"1px solid #331a1a",color:"#a44",borderRadius:4,fontSize:11,letterSpacing:2}}>DELETE</button>}
          <button onClick={save} style={{flex:2,padding:12,background:"#34D399",color:"#000",border:"none",borderRadius:4,fontSize:11,letterSpacing:2,fontWeight:700}}>{expense?"SAVE":"ADD"}</button>
        </div>
      </div>
    </div>
  );
}

// ====== WEEK VIEW ======
function WeekView({ selectedDate, setSelectedDate, expenses, categories, currency, today }) {
  const weekStart = new Date(selectedDate);
  weekStart.setDate(weekStart.getDate() - weekStart.getDay()); // Sunday start
  const weekDays = Array.from({length:7}).map((_,i) => {
    const d = new Date(weekStart); d.setDate(d.getDate()+i); return d;
  });

  const weekExpenses = expenses.filter(e => {
    const d = new Date(e.date + "T00:00:00");
    return d >= weekStart && d <= new Date(weekDays[6].getTime() + 86400000);
  });

  const total = weekExpenses.reduce((s,e) => s+e.amount, 0);
  const dailyTotals = weekDays.map(d => {
    const k = fmtDate(d);
    return weekExpenses.filter(e => e.date === k).reduce((s,e) => s+e.amount, 0);
  });
  const maxDaily = Math.max(...dailyTotals, 1);

  const byCategory = {};
  weekExpenses.forEach(e => {
    if (!byCategory[e.categoryId]) byCategory[e.categoryId] = 0;
    byCategory[e.categoryId] += e.amount;
  });
  const grouped = groupBySubcategory(weekExpenses);
  const catLookup = {};
  categories.forEach(c => catLookup[c.id] = c);

  const prevWeek = () => { const d = new Date(selectedDate); d.setDate(d.getDate()-7); setSelectedDate(d); };
  const nextWeek = () => { const d = new Date(selectedDate); d.setDate(d.getDate()+7); setSelectedDate(d); };

  return (
    <div className="fade-in" style={{maxWidth:720,margin:"0 auto",padding:"0 20px"}}>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:12,gap:8}}>
        <button onClick={prevWeek} style={{background:"#161616",border:"1px solid #222",color:"#888",padding:"8px 14px",borderRadius:4,fontSize:14}}>‹</button>
        <div style={{textAlign:"center",flex:1}}>
          <div style={{fontSize:10,color:"#555",letterSpacing:3}}>WEEK</div>
          <div style={{fontSize:13,color:"#aaa",marginTop:2}}>
            {monthShort[weekStart.getMonth()]} {weekStart.getDate()} – {monthShort[weekDays[6].getMonth()]} {weekDays[6].getDate()}
          </div>
        </div>
        <button onClick={nextWeek} style={{background:"#161616",border:"1px solid #222",color:"#888",padding:"8px 14px",borderRadius:4,fontSize:14}}>›</button>
      </div>

      <div style={{background:"#111",border:"1px solid #1e1e1e",borderLeft:"3px solid #4ECDC4",borderRadius:8,padding:"16px 18px",marginBottom:12}}>
        <div style={{fontSize:9,color:"#555",letterSpacing:3}}>WEEKLY TOTAL</div>
        <div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:38,color:"#fff",lineHeight:1,marginTop:4}}>{fmtMoney(total, currency)}</div>
        <div style={{fontSize:11,color:"#666",marginTop:4}}>avg {fmtMoney(total/7, currency)}/day</div>
      </div>

      {/* Daily bar chart */}
      <div style={{background:"#111",border:"1px solid #1e1e1e",borderRadius:8,padding:14,marginBottom:12}}>
        <div style={{fontSize:10,color:"#555",letterSpacing:3,marginBottom:14}}>DAILY BREAKDOWN</div>
        <div style={{display:"flex",alignItems:"flex-end",gap:6,height:140,marginBottom:8}}>
          {weekDays.map((d, i) => {
            const amt = dailyTotals[i];
            const h = maxDaily > 0 ? (amt/maxDaily)*100 : 0;
            const isToday = fmtDate(d) === fmtDate(today);
            return (
              <div key={i} onClick={()=>setSelectedDate(d)} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:4,cursor:"pointer"}}>
                <div style={{fontSize:9,color:amt>0?"#4ECDC4":"#444",fontFamily:"'Bebas Neue',sans-serif",height:14}}>

                  <div style={{width:"100%",background:isToday?"#4ECDC4":"#4ECDC499",height:`${Math.max(h,2)}%`,transition:"height 0.3s",borderRadius:4}} />
                </div>
                <div style={{fontSize:9,color:isToday?"#fff":"#666",letterSpacing:1,fontWeight:isToday?700:400}}>{dayShort[d.getDay()]}</div>
                <div style={{fontSize:9,color:"#555"}}>{d.getDate()}</div>
              </div>

      {/* By category */}
      {Object.keys(grouped).length > 0 && (
        <div style={{background:"#111",border:"1px solid #1e1e1e",borderRadius:8,padding:14}}>
          <div style={{fontSize:10,color:"#555",letterSpacing:3,marginBottom:10}}>BY CATEGORY</div>
          {Object.entries(grouped).sort((a,b)=>b[1].total-a[1].total).map(([catId, info]) => {
            const cat = catLookup[catId] || { name:"Unknown", icon:"❓", color:"#666", subcategories:[] };
            const pct = (info.total/total)*100;

                  <div style={{marginTop:6,marginLeft:8,paddingLeft:10,borderLeft:`1px solid ${cat.color}33`}}>

                      const sub = subLookup(cat, subId);
                      const subName = sub ? sub.name : (subId === "none" ? "Uncategorized" : "Unknown");
                      const subPct = (subAmt/info.total)*100;
                      return (
                        <div key={subId} style={{display:"flex",justifyContent:"space-between",fontSize:10,color:"#888",padding:"2px 0"}}>
                          <span>↳ {subName} <span style={{color:"#555",fontSize:9}}>({subPct.toFixed(0)}%)</span></span>
                          <span style={{color:"#aaa"}}>{fmtMoney(subAmt, currency)}</span>

                    })}

            );
          })}
        </div>
      )}
    </div>
  );

// ====== MONTH VIEW ======
function MonthView({ calendarMonth, setCalendarMonth, expenses, categories, currency, profile, today }) {
  const year = calendarMonth.getFullYear();
  const month = calendarMonth.getMonth();
  const monthExpenses = expenses.filter(e => {
    const d = new Date(e.date + "T00:00:00");
    return d.getFullYear() === year && d.getMonth() === month;
  });
  const total = monthExpenses.reduce((s,e) => s+e.amount, 0);
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const today_ = today.getFullYear()===year && today.getMonth()===month ? today.getDate() : daysInMonth;
  const dailyAvg = total / today_;

  const byCategory = {};
  monthExpenses.forEach(e => {
    if (!byCategory[e.categoryId]) byCategory[e.categoryId] = 0;
    byCategory[e.categoryId] += e.amount;
  });
  const grouped = groupBySubcategory(monthExpenses);
  const catLookup = {};
  categories.forEach(c => catLookup[c.id] = c);

  const budget = profile.monthlyBudget || 0;
  const budgetPct = budget > 0 ? Math.round((total/budget)*100) : 0;
  const budgetLeft = budget - total;

  const prevMonth = () => { const d = new Date(calendarMonth); d.setMonth(d.getMonth()-1); setCalendarMonth(d); };
  const nextMonth = () => { const d = new Date(calendarMonth); d.setMonth(d.getMonth()+1); setCalendarMonth(d); };

  // Daily expenses for heatmap
  const dailyTotals = Array.from({length: daysInMonth}).map((_,i) => {
    const k = fmtDate(new Date(year, month, i+1));
    return monthExpenses.filter(e => e.date === k).reduce((s,e) => s+e.amount, 0);
  });
  const maxDaily = Math.max(...dailyTotals, 1);

  return (
    <div className="fade-in" style={{maxWidth:720,margin:"0 auto",padding:"0 20px"}}>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:12,gap:8}}>
        <button onClick={prevMonth} style={{background:"#161616",border:"1px solid #222",color:"#888",padding:"8px 14px",borderRadius:4,fontSize:14}}>‹</button>
        <div style={{textAlign:"center",flex:1}}>
          <div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:22,letterSpacing:3,color:"#fff"}}>{monthNames[month].toUpperCase()}</div>
          <div style={{fontSize:10,color:"#555",letterSpacing:3}}>{year}</div>
        </div>
        <button onClick={nextMonth} style={{background:"#161616",border:"1px solid #222",color:"#888",padding:"8px 14px",borderRadius:4,fontSize:14}}>›</button>
      </div>

      <div style={{background:"#111",border:"1px solid #1e1e1e",borderLeft:"3px solid #A78BFA",borderRadius:8,padding:"16px 18px",marginBottom:12}}>
        <div style={{fontSize:9,color:"#555",letterSpacing:3}}>MONTH TOTAL</div>
        <div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:38,color:"#fff",lineHeight:1,marginTop:4}}>{fmtMoney(total, currency)}</div>
        <div style={{fontSize:11,color:"#666",marginTop:4}}>avg {fmtMoney(dailyAvg, currency)}/day · {monthExpenses.length} expenses</div>

        {budget > 0 && (
          <div style={{marginTop:12,paddingTop:12,borderTop:"1px solid #222"}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"baseline",marginBottom:6}}>
              <span style={{fontSize:9,color:"#555",letterSpacing:2}}>BUDGET</span>
              <span style={{fontSize:11,color:budgetLeft>=0?"#34D399":"#FF6B6B"}}>{fmtMoney(budget, currency)}</span>
            </div>
            <div style={{background:"#222",height:6,borderRadius:99,overflow:"hidden"}}>
              <div style={{width:`${Math.min(100,budgetPct)}%`,height:"100%",background:budgetPct>100?"#FF6B6B":budgetPct>80?"#FFE66D":"#34D399",transition:"width 0.3s"}} />
            </div>
            <div style={{display:"flex",justifyContent:"space-between",marginTop:4,fontSize:10}}>
              <span style={{color:"#666"}}>{budgetPct}% used</span>
              <span style={{color:budgetLeft>=0?"#34D399":"#FF6B6B"}}>
                {budgetLeft>=0 ? `${fmtMoney(budgetLeft, currency)} left` : `${fmtMoney(-budgetLeft, currency)} over`}
              </span>
            </div>
          </div>
        )}
      </div>

      {/* Daily heatmap */}
      <div style={{background:"#111",border:"1px solid #1e1e1e",borderRadius:8,padding:14,marginBottom:12}}>
        <div style={{fontSize:10,color:"#555",letterSpacing:3,marginBottom:10}}>DAILY HEATMAP</div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(28px,1fr))",gap:3}}>
          {dailyTotals.map((amt, i) => {
            const intensity = amt > 0 ? Math.min(1, amt/maxDaily) : 0;
            const isCurrent = today.getFullYear()===year && today.getMonth()===month && today.getDate()===i+1;
            return (
              <div key={i} title={`Day ${i+1}: ${fmtMoney(amt, currency)}`}
                style={{aspectRatio:"1",background:intensity>0?`rgba(167,139,250,${0.2 + intensity*0.8})`:"#1a1a1a",borderRadius:3,border:isCurrent?"1px solid #fff":"none",display:"flex",alignItems:"center",justifyContent:"center",fontSize:9,color:intensity>0.5?"#000":"#666"}}>
                {i+1}
              </div>
            );
          })}
        </div>
      </div>

      {/* By category */}
      {Object.keys(grouped).length > 0 && (
        <div style={{background:"#111",border:"1px solid #1e1e1e",borderRadius:8,padding:14}}>
          <div style={{fontSize:10,color:"#555",letterSpacing:3,marginBottom:10}}>SPENDING BY CATEGORY</div>
          {Object.entries(grouped).sort((a,b)=>b[1].total-a[1].total).map(([catId, info]) => {
            const cat = catLookup[catId] || { name:"Unknown", icon:"❓", color:"#666", budget:0, subcategories:[] };
            const pct = (info.total/total)*100;
            const catBudget = cat.budget || 0;
            const catBudgetPct = catBudget > 0 ? (info.total/catBudget)*100 : 0;
            const subEntries = Object.entries(info.bySub).sort((a,b)=>b[1]-a[1]);
            const hasMultipleSubs = subEntries.length > 1 || (subEntries.length === 1 && subEntries[0][0] !== "none");
            return (
              <div key={catId} style={{marginBottom:14}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:4}}>
                  <span style={{fontSize:12,color:"#ddd"}}>{cat.icon} {cat.name}</span>
                  <span style={{fontSize:14,color:cat.color,fontFamily:"'Bebas Neue',sans-serif"}}>{fmtMoney(info.total, currency)}</span>
                </div>
                <div style={{background:"#222",height:3,borderRadius:99,overflow:"hidden"}}>
                  <div style={{width:`${pct}%`,height:"100%",background:cat.color}} />
                </div>
                <div style={{display:"flex",justifyContent:"space-between",marginTop:2,fontSize:9,color:"#555"}}>
                  <span>{pct.toFixed(0)}% of total</span>
                  {catBudget > 0 && <span style={{color:catBudgetPct>100?"#FF6B6B":"#666"}}>budget {fmtMoney(catBudget, currency)} ({catBudgetPct.toFixed(0)}%)</span>}
                </div>
                {hasMultipleSubs && (
                  <div style={{marginTop:6,marginLeft:8,paddingLeft:10,borderLeft:`1px solid ${cat.color}33`}}>
                    {subEntries.map(([subId, subAmt]) => {
                      const sub = subLookup(cat, subId);
                      const subName = sub ? sub.name : (subId === "none" ? "Uncategorized" : "Unknown");
                      const subPct = (subAmt/info.total)*100;
                      return (
                        <div key={subId} style={{display:"flex",justifyContent:"space-between",fontSize:10,color:"#888",padding:"2px 0"}}>
                          <span>↳ {subName} <span style={{color:"#555",fontSize:9}}>({subPct.toFixed(0)}%)</span></span>
                          <span style={{color:"#aaa"}}>{fmtMoney(subAmt, currency)}</span>
                        </div>
                      );
                    })}
                  </div>
                )}
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

            const h = maxMonthly > 0 ? (amt/maxMonthly)*100 : 0;
            const isCurrent = year===today.getFullYear() && i===today.getMonth();
            return (
              <div key={i} onClick={()=>{const d=new Date(year,i,1);setCalendarMonth(d);}} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:4,cursor:"pointer"}}>
                <div style={{fontSize:8,color:amt>0?"#FFE66D":"#444",fontFamily:"'Bebas Neue',sans-serif",height:14,letterSpacing:1}}>
                  {amt > 0 ? fmtMoneyShort(amt, currency).replace(currency,'') : ""}
                </div>
                <div style={{flex:1,width:"100%",background:"#1a1a1a",borderRadius:3,position:"relative",overflow:"hidden",minHeight:4,display:"flex",alignItems:"flex-end"}}>
                  <div style={{width:"100%",background:isCurrent?"#FFE66D":"#FFE66D99",height:`${Math.max(h,2)}%`,transition:"height 0.3s",borderRadius:3}} />
                </div>
                <div style={{fontSize:9,color:isCurrent?"#fff":"#666",fontWeight:isCurrent?700:400}}>{monthShort[i].slice(0,1)}</div>
              </div>
            );
          })}
        </div>
      </div>

      {/* Yearly category summary */}
      {Object.keys(grouped).length > 0 && (
        <div style={{background:"#111",border:"1px solid #1e1e1e",borderRadius:8,padding:14}}>
          <div style={{fontSize:10,color:"#555",letterSpacing:3,marginBottom:10}}>CATEGORY TOTALS</div>
          {Object.entries(grouped).sort((a,b)=>b[1].total-a[1].total).map(([catId, info]) => {
            const cat = catLookup[catId] || { name:"Unknown", icon:"❓", color:"#666", subcategories:[] };
            const pct = (info.total/total)*100;
            const subEntries = Object.entries(info.bySub).sort((a,b)=>b[1]-a[1]);
            const hasMultipleSubs = subEntries.length > 1 || (subEntries.length === 1 && subEntries[0][0] !== "none");
            return (
              <div key={catId} style={{marginBottom:12}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:4}}>
                  <span style={{fontSize:12,color:"#ddd"}}>{cat.icon} {cat.name}</span>
                  <span style={{fontSize:14,color:cat.color,fontFamily:"'Bebas Neue',sans-serif"}}>{fmtMoney(info.total, currency)}</span>
                </div>
                <div style={{background:"#222",height:3,borderRadius:99,overflow:"hidden"}}>
                  <div style={{width:`${pct}%`,height:"100%",background:cat.color}} />
                </div>
                <div style={{fontSize:9,color:"#555",marginTop:2}}>
                  {pct.toFixed(0)}% · avg {fmtMoney(info.total/12, currency)}/month
                </div>
                {hasMultipleSubs && (
                  <div style={{marginTop:6,marginLeft:8,paddingLeft:10,borderLeft:`1px solid ${cat.color}33`}}>
                    {subEntries.map(([subId, subAmt]) => {
                      const sub = subLookup(cat, subId);
                      const subName = sub ? sub.name : (subId === "none" ? "Uncategorized" : "Unknown");
                      const subPct = (subAmt/info.total)*100;
                      return (
                        <div key={subId} style={{display:"flex",justifyContent:"space-between",fontSize:10,color:"#888",padding:"2px 0"}}>
                          <span>↳ {subName} <span style={{color:"#555",fontSize:9}}>({subPct.toFixed(0)}%)</span></span>
                          <span style={{color:"#aaa"}}>{fmtMoney(subAmt, currency)}</span>
                        </div>
                      );
                    })}
                  </div>
                )}
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

// ====== CALENDAR VIEW ======
function CalendarView({ calendarMonth, setCalendarMonth, today, setSelectedDate, setView, expenses, categories, currency }) {
  const buildCalendar = () => {
    const year = calendarMonth.getFullYear();
    const month = calendarMonth.getMonth();
    const firstDay = new Date(year, month, 1).getDay();
    const daysInMonth = new Date(year, month+1, 0).getDate();
    const cells = [];
    for (let i=0; i<firstDay; i++) cells.push(null);
    for (let d=1; d<=daysInMonth; d++) cells.push(new Date(year, month, d));
    return cells;
  };

  const dayTotal = (date) => {
    if (!date) return 0;
    const k = fmtDate(date);
    return expenses.filter(e => e.date === k).reduce((s,e) => s+e.amount, 0);
  };

  const allTotals = buildCalendar().filter(d=>d).map(dayTotal);
  const maxAmt = Math.max(...allTotals, 1);

  return (
    <div className="fade-in" style={{maxWidth:720,margin:"0 auto",padding:"0 20px"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
        <button onClick={()=>{const d=new Date(calendarMonth);d.setMonth(d.getMonth()-1);setCalendarMonth(d);}} style={{background:"#161616",border:"1px solid #222",color:"#888",padding:"8px 14px",borderRadius:4}}>‹</button>
        <div style={{textAlign:"center"}}>
          <div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:22,letterSpacing:3,color:"#fff"}}>{monthNames[calendarMonth.getMonth()].toUpperCase()}</div>
          <div style={{fontSize:10,color:"#555",letterSpacing:3}}>{calendarMonth.getFullYear()}</div>
        </div>
        <button onClick={()=>{const d=new Date(calendarMonth);d.setMonth(d.getMonth()+1);setCalendarMonth(d);}} style={{background:"#161616",border:"1px solid #222",color:"#888",padding:"8px 14px",borderRadius:4}}>›</button>
      </div>

      <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:4,marginBottom:6}}>
        {dayShort.map((d,i)=>(<div key={i} style={{textAlign:"center",fontSize:10,color:"#555",letterSpacing:2}}>{d}</div>))}
      </div>

      <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:4}}>
        {buildCalendar().map((date,i)=>{
          if (!date) return <div key={i} />;
          const amt = dayTotal(date);
          const intensity = amt > 0 ? Math.min(1, amt/maxAmt) : 0;
          const isCurrentDay = fmtDate(date) === fmtDate(today);
          return (
            <button key={i} onClick={()=>{setSelectedDate(date);setView("today");}} style={{
              aspectRatio:"1",
              background: amt > 0 ? `rgba(52,211,153,${0.15 + intensity*0.6})` : "#111",
              border:`1px solid ${isCurrentDay?"#fff":"#1a1a1a"}`,
              borderRadius:4,padding:4,
              display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",
              color:"#888"
            }}>
              <div style={{fontSize:13,color:isCurrentDay?"#fff":amt>0?"#000":"#aaa",fontWeight:isCurrentDay?700:400}}>{date.getDate()}</div>
              {amt > 0 && <div style={{fontSize:8,color:"#000",marginTop:1,fontFamily:"'Bebas Neue',sans-serif"}}>{fmtMoneyShort(amt, currency).replace(currency,'')}</div>}
            </button>
          );
        })}
      </div>

      <div style={{marginTop:16,padding:12,background:"#111",border:"1px solid #1a1a1a",borderRadius:6,fontSize:10,color:"#666"}}>
        Tap any day to view expenses or add new ones.
      </div>
    </div>
  );
}

// ====== SETTINGS / CATEGORIES VIEW ======
function BackupSection() {
  const [importing, setImporting] = useState(false);
  const [message, setMessage] = useState(null);

  const KEYS = ["expenses", "categories", "profile"];

  const exportData = () => {
    try {
      const backup = {
        app: "EXPENSE LOG",
        version: 1,
        exportedAt: new Date().toISOString(),
        data: {},
      };
      for (const key of KEYS) {
        const val = localStorage.getItem(key);
        if (val !== null) backup.data[key] = val;
      }
      const json = JSON.stringify(backup, null, 2);
      const blob = new Blob([json], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      const ts = new Date().toISOString().slice(0,10);
      a.href = url;
      a.download = `expense-log-backup-${ts}.json`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      const itemCount = Object.keys(backup.data).length;
      setMessage({ type: "ok", text: `✓ Exported ${itemCount} data ${itemCount===1?"category":"categories"}. File saved to your downloads.` });
      setTimeout(()=>setMessage(null), 5000);
    } catch (e) {
      setMessage({ type: "err", text: `Export failed: ${e.message}` });
    }
  };

  const handleImport = (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    setImporting(true);
    const reader = new FileReader();
    reader.onload = (event) => {
      try {
        const backup = JSON.parse(event.target.result);
        if (!backup || backup.app !== "EXPENSE LOG" || !backup.data) {
          throw new Error("Not a valid EXPENSE LOG backup file");
        }
        const keysFound = Object.keys(backup.data).filter(k => KEYS.includes(k));
        if (keysFound.length === 0) throw new Error("Backup file is empty or contains no recognized data");

        const proceed = confirm(
          `Restore backup from ${new Date(backup.exportedAt).toLocaleString()}?\n\n` +
          `This will REPLACE all current data:\n${keysFound.map(k=>"• "+k).join("\n")}\n\n` +
          `Your current data will be lost. Continue?`
        );
        if (!proceed) { setImporting(false); e.target.value = ""; return; }

        for (const key of keysFound) {
          localStorage.setItem(key, backup.data[key]);
        }
        setMessage({ type: "ok", text: `✓ Imported ${keysFound.length} categories. Reloading app...` });
        setTimeout(()=>window.location.reload(), 1200);
      } catch (err) {
        setMessage({ type: "err", text: `Import failed: ${err.message}` });
        setImporting(false);
      }
      e.target.value = "";
    };
    reader.onerror = () => {
      setMessage({ type: "err", text: "Could not read file" });
      setImporting(false);
      e.target.value = "";
    };
    reader.readAsText(file);
  };

  return (
    <>
      <div style={{fontSize:10,color:"#555",letterSpacing:3,marginBottom:10}}>💾 BACKUP & RESTORE</div>
      <div style={{background:"#111",border:"1px solid #1e1e1e",borderLeft:"3px solid #34D399",borderRadius:8,padding:16,marginBottom:14}}>
        <div style={{fontSize:10,color:"#888",lineHeight:1.6,marginBottom:12}}>
          Save all your data (expenses, categories, subcategories, budgets) to a JSON file. Restore on this device or transfer to another phone.
        </div>
        <div style={{display:"flex",gap:8,marginBottom:10}}>
          <button onClick={exportData}
            style={{flex:1,padding:12,background:"#34D399",color:"#000",border:"none",borderRadius:4,fontSize:11,letterSpacing:2,fontWeight:700}}>
            ⬇ EXPORT DATA
          </button>
          <label style={{flex:1,padding:12,background:"#1a1a1a",color:"#34D399",border:"1px solid #34D39955",borderRadius:4,fontSize:11,letterSpacing:2,fontWeight:700,textAlign:"center",cursor:"pointer",opacity:importing?0.5:1}}>
            ⬆ IMPORT DATA
            <input type="file" accept=".json,application/json" onChange={handleImport} style={{display:"none"}} disabled={importing} />
          </label>
        </div>
        {message && (
          <div style={{padding:10,background:message.type==="ok"?"#0a2a1a":"#3a1212",border:`1px solid ${message.type==="ok"?"#34D39955":"#FF6B6B55"}`,borderRadius:4,fontSize:10,color:message.type==="ok"?"#34D399":"#FF6B6B",lineHeight:1.5}}>
            {message.text}
          </div>
        )}
        <div style={{fontSize:9,color:"#555",marginTop:10,lineHeight:1.5}}>
          💡 Tip: Export monthly for safekeeping. The JSON file can be saved to Drive, emailed, or imported on a new device.
        </div>
      </div>
    </>
  );
}

function SettingsView({ categories, updateCategories, profile, updateProfile, onReset, onResetCats }) {
  const [editingCat, setEditingCat] = useState(null);
  const [addingCat, setAddingCat] = useState(false);
  const [local, setLocal] = useState(profile);
  useEffect(()=>setLocal(profile),[profile]);

  const update = (field, value) => { const newP = { ...local, [field]: value }; setLocal(newP); updateProfile(newP); };

  const saveCategory = (cat) => {
    if (editingCat) {
      const updated = categories.map(c => c.id === editingCat.id ? cat : c);
      updateCategories(updated);
    } else {
      const newCat = { ...cat, id: `custom_${Date.now()}` };
      updateCategories([...categories, newCat]);
    }
    setEditingCat(null);
    setAddingCat(false);
  };

  const deleteCategory = (id) => {
    if (categories.length <= 1) { alert("You need at least 1 category"); return; }
    if (confirm("Delete this category? Existing expenses will be marked Unknown.")) {
      updateCategories(categories.filter(c => c.id !== id));
      setEditingCat(null);

    <div className="fade-in" style={{maxWidth:720,margin:"0 auto",padding:"0 20px"}}>
      <BackupSection />

              <option value="C$">C$ CAD</option>
              <option value="A$">A$ AUD</option>
              <option value="د.إ">د.إ AED</option>
            </select>
          </div>
          <div>
            <div style={{fontSize:9,color:"#555",letterSpacing:2,marginBottom:5}}>MONTHLY BUDGET</div>
            <input type="number" min="0" step="100" value={local.monthlyBudget||""} onChange={(e)=>update("monthlyBudget",parseFloat(e.target.value)||0)} placeholder="0 (none)" />
          </div>
        </div>
      </div>

      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
        <div style={{fontSize:10,color:"#555",letterSpacing:3}}>CATEGORIES</div>
        <button onClick={()=>{setAddingCat(true);setEditingCat(null);}}
          style={{background:"#34D399",color:"#000",border:"none",borderRadius:4,padding:"6px 12px",fontSize:10,letterSpacing:2,fontWeight:700}}>
          + ADD
        </button>
      </div>

      <div style={{display:"flex",flexDirection:"column",gap:5,marginBottom:14}}>
        {categories.map(cat => {
          const subCount = (cat.subcategories || []).length;
          return (
          <div key={cat.id} className="ex-row" onClick={()=>setEditingCat(cat)}
            style={{background:"#111",border:`1px solid ${cat.color}33`,borderLeft:`3px solid ${cat.color}`,borderRadius:6,padding:"12px 14px",display:"flex",alignItems:"center",gap:12,transition:"all 0.2s"}}>
            <div style={{fontSize:24}}>{cat.icon}</div>
            <div style={{flex:1,minWidth:0}}>
              <div style={{fontSize:13,color:"#ddd"}}>{cat.name}</div>
              <div style={{display:"flex",gap:10,marginTop:2}}>
                {cat.budget > 0 && <span style={{fontSize:10,color:"#666"}}>budget: {fmtMoney(cat.budget, local.currency)}/mo</span>}
                {subCount > 0 && <span style={{fontSize:10,color:cat.color}}>{subCount} sub{subCount===1?"":"s"}</span>}
              </div>
            </div>
            <span style={{color:cat.color,fontSize:14}}>✎</span>

      <div style={{textAlign:"center",marginTop:24,fontSize:9,color:"#333",letterSpacing:2}}>DATA SAVED LOCALLY · WORKS OFFLINE</div>

  );

              "🥛","🍞","🌶","🧂","🫒","🧴","🧼",
              "🍌","🍎","🥭","🍊","🍓","🍇","🥜",
              "🥬","🥔","🥒","🍅","🌶","🥦",
              "🚗","🏍","🛵","🚕","🛺","🚇","🚌","🚆","🅿","🔧","📄",
              "💊","👨‍⚕️","🧪","🦷","🏥","🛡","💪",
              "💡","💧","📶","📱","🔥","🏠","🛠",
              "👕","👟","💻","🛋","🎁",
              "🎬","📺","🎮","📚","🎪","🎯","🎨",
              "🙏","📖","💇","🐕","📋","💳","❓"].map(em => (
              <button key={em} type="button" onClick={()=>setNewSubName((newSubName ? newSubName.replace(/^[^\w\s]+\s*/, "") : "") ? `${em} ${newSubName.replace(/^[^\w\s]+\s*/, "")}` : `${em} `)}
                style={{padding:"4px 6px",background:"#1a1a1a",border:"1px solid #2a2a2a",borderRadius:3,fontSize:14,cursor:"pointer"}}>
                {em}
              </button>
            ))}
          </div>

          <div style={{fontSize:9,color:"#555",marginTop:6,lineHeight:1.5}}>
            Subcategories let you break down spending (e.g. Food → 🍗 Chicken / 🐟 Fish / 🥗 Veg). Tap an emoji above to prefix it to your name, then type the rest.
          </div>
        </div>

        <div style={{display:"flex",gap:6}}>
          <button onClick={onCancel} style={{flex:1,padding:12,background:"transparent",border:"1px solid #333",color:"#888",borderRadius:4,fontSize:11,letterSpacing:2}}>CANCEL</button>
          {onDelete && <button onClick={onDelete} style={{padding:"12px 16px",background:"transparent",border:"1px solid #331a1a",color:"#a44",borderRadius:4,fontSize:11,letterSpacing:2}}>DELETE</button>}
          <button onClick={()=>{ if(name.trim()) onSave({...(category||{}),name:name.trim(),icon,color,budget,subcategories}); }}
            style={{flex:2,padding:12,background:color,color:"#000",border:"none",borderRadius:4,fontSize:11,letterSpacing:2,fontWeight:700}}>
            {category?"SAVE":"ADD"}
          </button>
        </div>
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<ExpenseLog />);
</script>
</body>
</html>
